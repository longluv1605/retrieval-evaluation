# Log-posterior fusion variant: score = similarity + w * log P(x_i).
#
# NOT the published setting. The ICARCV 2026 paper uses probability fusion
# (score = similarity + alpha * P(x_i), alpha = 1); see
# configs/retrieval.sequence.yaml. Because log P is unbounded below rather
# than O(1) in [0, 1], this variant needs a small hand-tuned weight and does
# not satisfy the commensurate-by-construction argument the paper relies on.
# Kept for comparison only; do not use it to reproduce paper numbers.
retrieval:
  global_model: megaloc
  top_k: 10
  overwrite_features: false
  sequence:
    sequence_file: query_sequences.json
    num_candidates: 100
    tau: 0.01
    v_max: 3.0
    eps: 0.1
    use_query_displacement: false
    lambda_dist: 0.0
    sigma_d: 1.0
    transition_weight: 1.0
    fusion: logprob_add
    fusion_weight: 0.05
    max_dt_s: 30.0
    timestamp_unit: us
    dt_s_default: 10.0
