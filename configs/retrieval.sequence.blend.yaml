# Assisted ablation "Blend" (lambda_d = 0.5), ICARCV 2026 Table II.
#
# Uses adjacent query displacement as an idealized motion proxy. In the paper
# this magnitude is derived from ground-truth query poses, NOT measured VIO;
# it is an upper bound on what real odometry would deliver.
# Content matches configs/retrieval.sequence.legacy_blended.yaml (frozen provenance).
retrieval:
  global_model: megaloc
  top_k: 10
  overwrite_features: false
  sequence:
    sequence_file: query_sequences.json
    num_candidates: 100
    tau: 0.01
    v_max: 3.0
    eps: 0.1
    use_query_displacement: true
    lambda_dist: 0.5
    sigma_d: 1.0
    transition_weight: 1.0
    fusion: prob_add
    fusion_weight: 1.0
    max_dt_s: 30.0
    timestamp_unit: us
    dt_s_default: 10.0
