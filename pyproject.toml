[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-evaluation"
version = "0.1.0"
description = "Retrieval benchmark with pluggable methods and distance-based evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "h5py>=3.10"]

[tool.setuptools.packages.find]
include = ["retrieval_eval*"]
